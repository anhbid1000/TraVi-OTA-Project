spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false
    placeholders:
      json_type: JSON
      reserved_index_filter: ""
      seed_default_loyalty_suffix: ""
  
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 2000ms
  
  mail:
    host: localhost
    port: 1025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

jwt:
  secret: test-secret-key-for-integration-tests-minimum-256-bits-long-string-here
  expiration: 3600000

logging:
  level:
    com.ota.travi: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
