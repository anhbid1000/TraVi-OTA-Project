# =============================================
# PROFILE TEST - Dung cho Unit va Integration Test
# =============================================

# Su dung H2 Database in-memory (nhanh va khong can PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Fake JWT for test
SECRET_KEY=your_dummy_secret_key_for_testing_at_least_32_characters_long
JWT_EXPIRATION=900

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.flyway.placeholders.json_type=JSON
spring.flyway.placeholders.reserved_index_filter=
spring.flyway.placeholders.seed_default_loyalty_suffix=

# Tat Redis trong test (tru khi can test Redis)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Tat OpenAI trong test (tranh goi API that)
spring.ai.openai.api-key=dummy-key-for-test
spring.ai.openai.chat.options.model=gpt-4o-mini

# Mail gia lap cho test de Spring tao JavaMailSender bean, khong dung SMTP that
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test

# Tat Swagger trong test
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Logging
logging.level.com.ota.travi=INFO
logging.level.org.hibernate.SQL=ERROR

# File Upload config for local storage (Test)
file.upload.dir=target/test-uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
