# ==================================
# Database - PostgreSQL
# ==================================
#spring.datasource.url=jdbc:postgresql://localhost:5432/travi_db - Dung neu chay tren local
#spring.datasource.url=jdbc:postgresql://postgres:5432/travi_db - Dung neu chay tren Docker, "postgres" la ten service trong docker-compose
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travi_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Lumitap2026}
spring.datasource.driver-class-name=org.postgresql.Driver



# ==================================
# JPA & Hibernate
# ==================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ddl-auto=update: dev mode cho phép Hibernate bổ sung bảng còn thiếu sau khi Flyway chạy migration.
# dialect: Chỉ định ngôn ngữ SQL cụ thể của PostgreSQL để Hibernate tối ưu hóa câu lệnh.

# ==================================
# Flyway Migration
# ==================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8
spring.flyway.validate-migration-naming=true



# ===============================
# Spring Mail
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=true

# ==================================
# Redis
# ==================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


# ==================================
# Spring AI - OpenAI
# ==================================
spring.ai.openai.api-key= ${OPENAI_API_KEY:sk-dummy-key-for-dev}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
#api-key: Khoa API cua OpenAI. Cu phap ${...:default} nghia la uu tien lay tu bien moi truong, neu khong co thi dung sk-dummy....
#temperature: Do "sang tao" cua AI (0.7 la muc can bang giua logic va tu nhien).


# ===============================
# Swagger / Springdoc OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.groups.enabled=true
# swagger-ui.path: Duong dan de xem tai lieu API (giao dien truc quan de test API).


# ===============================
# Actuator (Monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# exposure.include: Mo cac cong giam sat de kiem tra suc khoe he thong.


# ===============================
# Logging - Chi tiet de debug
# ===============================
logging.level.root=INFO
logging.level.com.ota.travi=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level: Quy dinh muc do chi tiet cua nhat ky he thong (INFO la binh thuong, DEBUG la rat chi tiet).

# ===============================
# DevTools
# ===============================
spring.devtools.restart.enabled=true


