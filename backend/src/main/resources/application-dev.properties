# ==================================
# Database - PostgreSQL
# ==================================
#spring.datasource.url=jdbc:postgresql://localhost:5432/travi_db - Dung neu chay tren local
#spring.datasource.url=jdbc:postgresql://postgres:5432/travi_db - Dung neu chay tren Docker, "postgres" la ten service trong docker-compose
spring.datasource.url=jdbc:postgresql://postgres:5432/travi_db
spring.datasource.username=postgres
spring.datasource.password=Lumitap2026
#spring.datasource.driver-class-name=org.postgresql.Driver



# ==================================
# JPA & Hibernate
# ==================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ddl-auto: Tu dong cap nhat cau truc bang trong DB dua tren cac Entity (class Java) ma khong lam mat du lieu cu.
# dialect: Chi dinh ngon ngu SQL cu the cua PostgreSQL de Hibernate toi uu hoa cau lenh.


# ==================================
# Redis
# ==================================
spring.data.redis.host=localhost
spring.data.redis.port=6379


# ==================================
# Spring AI - OpenAI
# ==================================
spring.ai.openai.api-key= ${OPENAI_API_KEY:sk-dummy-key-for-dev}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
#api-key: Khoa API cua OpenAI. Cu phap ${...:default} nghia la uu tien lay tu bien moi truong, neu khong co thi dung sk-dummy....
#temperature: Do "sang tao" cua AI (0.7 la muc can bang giua logic va tu nhien).


# ===============================
# Swagger / Springdoc OpenAPI
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.groups.enabled=true
# swagger-ui.path: Duong dan de xem tai lieu API (giao dien truc quan de test API).


# ===============================
# Actuator (Monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# exposure.include: Mo cac cong giam sat de kiem tra suc khoe he thong.


# ===============================
# Logging - Chi tiet de debug
# ===============================
logging.level.root=INFO
logging.level.com.ota.travi=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level: Quy dinh muc do chi tiet cua nhat ky he thong (INFO la binh thuong, DEBUG la rat chi tiet).

# ===============================
# DevTools
# ===============================
spring.devtools.restart.enabled=true