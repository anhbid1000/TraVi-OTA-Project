# =============================================
# PROFILE PROD - Danh cho Production
# =============================================
spring.profiles.active=prod

# Database - PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway - cho truong hop DB da ton tai schema nhung chua co flyway_schema_history
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8
spring.flyway.validate-migration-naming=${FLYWAY_VALIDATE_MIGRATION_NAMING:false}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

# JPA - Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Spring AI - OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

# Swagger - Tat o Production (bao mat)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Actuator -
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging - It log de toi uu performance
logging.level.root=WARN
logging.level.com.ota.travi=INFO
logging.level.org.hibernate.SQL=ERROR
