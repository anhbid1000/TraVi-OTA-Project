name: CI Pipeline - TraVi OTA

on:
  push:
    branches: [main, develop, "*"]
  pull_request:
    branches: [main, develop]

jobs:
  backend-build:
    name: Backend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Make Maven wrapper executable
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Build and Test Backend
        working-directory: ./backend
        run: ./mvnw clean verify -Dspring.profiles.active=test --no-transfer-progress

  frontend-build:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run Lint
        working-directory: ./frontend
        run: npm run lint --if-present

  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create dummy .env for CI
        run: |
          cat > .env << EOF
          POSTGRES_PASSWORD=dummy_password_for_ci
          OPENAI_API_KEY=sk-dummy-key-for-ci-only
          EOF

      - name: Build Docker images
        run: docker compose build --no-cache

      - name: Test Docker Compose config
        run: docker compose config
