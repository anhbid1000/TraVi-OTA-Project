services:
  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: travi-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: travi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: travi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ==================== BACKEND (Spring Boot) ====================
  backend:
    image: travi-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travi-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev # hoặc prod tùy lúc muốn test
      DB_URL: jdbc:postgresql://postgres:5432/travi_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL_ENV: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    volumes:
      - ./backend:/app
      - /app/target

    stdin_open: true
    tty: true

  # ==================== FRONTEND ====================
  frontend:
    image: travi-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travi-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
